name: ci

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test Hourbit.slnx --configuration Release --maxcpucount:1

  release:
    name: Package release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build release artifacts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -SkipSign

      - name: Run packaged smoke test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hourbit-release
          path: |
            artifacts/Hourbit-Setup-x64.exe
            artifacts/Hourbit-Setup-x64.exe.sha256
            artifacts/Hourbit-Portable-x64.zip
            artifacts/Hourbit-Portable-x64.zip.sha256
          if-no-files-found: error
