name: ci

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test Hourbit.slnx --configuration Release --maxcpucount:1 --blame-hang --blame-hang-timeout 120s --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First test pass failed; retrying once."
            dotnet test Hourbit.slnx --configuration Release --maxcpucount:1 --blame-hang --blame-hang-timeout 120s --logger "console;verbosity=detailed"
          }

      - name: Install dotnet-dump
        if: failure()
        run: dotnet tool install --global dotnet-dump

      - name: Analyze hang dump
        if: failure()
        shell: pwsh
        run: |
          $dump = Get-ChildItem -Path tests/Hourbit.App.Tests/TestResults -Recurse -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dump) { Write-Host "No hang dump found."; exit 0 }
          Write-Host "Analyzing $($dump.FullName)"
          dotnet-dump analyze $dump.FullName --command "clrstack -all" --command "exit" 2>&1 | Out-String

  release:
    name: Package unsigned CI fallback
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build release artifacts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -SkipSign -SkipTests

      - name: Run packaged smoke test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hourbit-release-unsigned-ci
          path: |
            artifacts/Hourbit-Setup-x64.exe
            artifacts/Hourbit-Setup-x64.exe.sha256
            artifacts/Hourbit-Portable-x64.zip
            artifacts/Hourbit-Portable-x64.zip.sha256
          if-no-files-found: error

      - name: Validate release tag
        shell: pwsh
        run: |
          [xml] $versionProps = Get-Content .\Version.props
          $version = [string]$versionProps.Project.PropertyGroup.SemanticVersion
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Version.props ($expectedTag)."
          }
          Write-Host "Validated $expectedTag. Public Release assets are signed and uploaded from the certificate-owning Windows machine."
