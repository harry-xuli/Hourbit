name: ci

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test Hourbit.slnx --configuration Release --maxcpucount:1 --blame-hang --blame-hang-timeout 120s --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First test pass failed; retrying once."
            dotnet test Hourbit.slnx --configuration Release --maxcpucount:1 --blame-hang --blame-hang-timeout 120s --logger "console;verbosity=detailed"
          }

  release:
    name: Package release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Import code-signing certificate
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGNING_PFX))
          $password = ConvertTo-SecureString $env:CODE_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          # Trust the self-signed certificate so Authenticode chain validation succeeds.
          $cerPath = Join-Path $env:RUNNER_TEMP 'codesign.cer'
          [IO.File]::WriteAllBytes($cerPath, $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Write-Host "Imported and trusted code-signing certificate."

      - name: Build release artifacts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -SkipTests

      - name: Run packaged smoke test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hourbit-release
          path: |
            artifacts/Hourbit-Setup-x64.exe
            artifacts/Hourbit-Setup-x64.exe.sha256
            artifacts/Hourbit-Portable-x64.zip
            artifacts/Hourbit-Portable-x64.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          gh release create $tag `
            "artifacts/Hourbit-Setup-x64.exe" `
            "artifacts/Hourbit-Setup-x64.exe.sha256" `
            "artifacts/Hourbit-Portable-x64.zip" `
            "artifacts/Hourbit-Portable-x64.zip.sha256" `
            --repo harry-xuli/Hourbit `
            --title "Hourbit 日程 $tag" `
            --notes "Hourbit 日程 $tag：中英文界面本地化、重复待办（schema v6）、数据重置、PDF/配对导出、搜索与未来日期导航；修复分析窗口日期选择器的语言绑定导致的启动崩溃。已使用个人代码签名证书签名。"
